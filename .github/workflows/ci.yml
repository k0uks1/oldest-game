name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.txt

      - name: Lint-Bericht als PR-Kommentar
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = fs.readFileSync("lint.txt", "utf8").replace(/\x1b\[[0-9;]*m/g, "");
            const cwd = process.cwd() + "/";
            const text = raw.split(cwd).join("").split("\n").slice(0, 400).join("\n");
            const marker = "<!-- oldest-game-lint -->";
            const body = `${marker}\n### ✖ ESLint\n\n\`\`\`\n${text.slice(0, 60000)}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Lint muss grün sein
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Balancing report
        run: npm run simulate -- --games 1000 > balance-report.txt

      - name: Upload playable build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: oldest-game-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          path: dist/index.html
          retention-days: 30

      - name: Upload balancing report
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-${{ github.sha }}
          path: balance-report.txt
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "## The Oldest Game – Build"
            echo ""
            echo "Spielbare Datei: **[index.html herunterladen](${{ steps.upload.outputs.artifact-url }})** (ZIP entpacken, im Browser öffnen)."
            echo ""
            echo "Größe: $(du -h dist/index.html | cut -f1)"
            echo ""
            echo "### Balancing"
            echo '```'
            grep -E "Selbstspiel|Aufgabegründe|Stufe je Runde|⚠" balance-report.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

  comment:
    name: Preview-Kommentar
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ needs.check.outputs.artifact-url }}
        with:
          script: |
            const marker = "<!-- oldest-game-preview -->";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "### ▶ Zum Testen im Browser",
              "",
              `1. **[index.html herunterladen](${process.env.ARTIFACT_URL})** (ZIP)`,
              "2. Entpacken und `index.html` im Browser öffnen – keine Installation nötig.",
              "3. Claude-API-Key eintragen – oder `index.html?debug` für den Debug-Modus ohne Claude.",
              "",
              `Commit \`${context.sha.slice(0, 7)}\` · [CI-Lauf & Balancing-Report](${run})`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
