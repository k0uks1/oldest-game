<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#050309" />
    <title>The Oldest Game</title>
    <meta name="description" content="Ein Duell der Vorstellungskraft für zwei Spieler." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=VT323&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2315111f'/%3E%3Crect x='7' y='2' width='2' height='3' fill='%23ffc64a'/%3E%3Crect x='6' y='5' width='4' height='3' fill='%23e8641c'/%3E%3Crect x='5' y='8' width='6' height='6' fill='%23a3300f'/%3E%3C/svg%3E" />
    <style>
      :root {
  color-scheme: dark;
  --bg: #050309;
  --panel: rgba(12, 8, 20, 0.94);
  --line: rgba(200, 160, 255, 0.16);
  --line-hi: rgba(200, 160, 255, 0.35);
  --text: #ece4f4;
  --muted: #8f86a6;
  --faint: #564e6c;
  --gold: #f0c850;
  --ember: #e8641c;
  --rune: #c8a0ff;
  --good: #9dff8a;
  --bad: #ff7a7a;
  --p0: #7fc6e8;
  --p1: #ff8a6a;
  --shadow: #020105;
  --title: "Jacquard 24", "UnifrakturMaguntia", serif;
  --mono: "VT323", ui-monospace, "Cascadia Mono", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 20px;
  line-height: 1.2;
}

body {
  background:
    radial-gradient(ellipse 70% 50% at 50% 40%, rgba(60, 30, 90, 0.18) 0%, transparent 70%),
    var(--bg);
}

#app {
  min-height: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}

:focus-visible {
  outline: 1px solid var(--gold);
  outline-offset: 3px;
}

/* ── Stage: the arena floats in the dark, no frame ───────────────────────── */

.stage {
  position: relative;
}
.screen {
  position: relative;
  line-height: 0;
}
/* On wide screens the tale floats over the arena (as before); on phones it flows below it. */
.tale {
  position: absolute;
  inset: 0;
  pointer-events: none;
  line-height: 1.2;
}
canvas.arena {
  width: 100%;
  max-width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  display: block;
  /* the edges dissolve into the page instead of ending at a border */
  -webkit-mask-image: radial-gradient(ellipse 58% 62% at 50% 50%, #000 62%, transparent 100%);
  mask-image: radial-gradient(ellipse 58% 62% at 50% 50%, #000 62%, transparent 100%);
}

/* ── Crown: sigil + round, top centre ───────────────────────────────────── */

.crown {
  position: absolute;
  left: 50%;
  top: 2.5%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  line-height: 1;
}
.sigil {
  width: 34px;
  height: 34px;
  padding: 3px;
  background: none;
  border: none;
  cursor: pointer;
  fill: var(--rune);
  opacity: 0.4;
  filter: drop-shadow(0 0 4px rgba(200, 160, 255, 0.6));
  transition:
    opacity 0.4s,
    filter 0.4s;
}
.sigil svg {
  width: 100%;
  height: 100%;
  display: block;
}
.sigil:hover,
.sigil:focus-visible {
  opacity: 1;
  filter: drop-shadow(0 0 8px rgba(200, 160, 255, 0.9));
}
.busy .sigil {
  animation: sigil-pulse 1.4s ease-in-out infinite;
}
@keyframes sigil-pulse {
  50% {
    opacity: 0.95;
    filter: drop-shadow(0 0 10px rgba(200, 160, 255, 1));
  }
}
.fields {
  display: flex;
  gap: 10px;
  font-size: 16px;
  letter-spacing: 0.12em;
  color: var(--muted);
  opacity: 0.75;
  text-shadow: 0 0 8px rgba(0, 0, 0, 1);
  min-height: 1em;
}
.fields span {
  cursor: help;
}
.round {
  font-family: var(--title);
  font-size: 22px;
  color: var(--faint);
  letter-spacing: 0.1em;
  text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
  min-height: 1em;
}

/* ── HUD: a name and a thread of light ──────────────────────────────────── */

.hud {
  position: absolute;
  top: 4%;
  width: min(26%, 240px);
  line-height: 1.1;
  opacity: 0.45;
  transition: opacity 0.5s;
}
.hud.left {
  left: 8%;
}
.hud.right {
  right: 8%;
  text-align: right;
}
.hud.active {
  opacity: 1;
}
.hud .name {
  font-size: 22px;
  letter-spacing: 0.04em;
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
}
.hud.left .name {
  color: var(--p0);
}
.hud.right .name {
  color: var(--p1);
}
.hud .bar {
  height: 2px;
  margin-top: 6px;
  background: rgba(255, 255, 255, 0.06);
}
.hud .fill {
  height: 100%;
  transition: width 0.8s ease;
}
.hud.left .fill {
  background: var(--p0);
  box-shadow: 0 0 6px var(--p0), 0 0 14px rgba(127, 198, 232, 0.6);
}
.hud.right .fill {
  background: var(--p1);
  box-shadow: 0 0 6px var(--p1), 0 0 14px rgba(255, 138, 106, 0.6);
  margin-left: auto;
}
.hud .stats {
  margin-top: 4px;
  font-size: 16px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.hud .eleganz {
  color: var(--gold);
  opacity: 0.8;
}
.hud .delta {
  position: absolute;
  top: 100%;
  font-size: 22px;
  pointer-events: none;
  animation: drift 2.2s ease-out forwards;
}
.hud.left .delta {
  left: 0;
}
.hud.right .delta {
  right: 0;
}
.hud .delta.down {
  color: var(--bad);
  text-shadow: 0 0 8px rgba(255, 90, 90, 0.7);
}
.hud .delta.up {
  color: var(--good);
  text-shadow: 0 0 8px rgba(120, 255, 100, 0.6);
}
@keyframes drift {
  0% {
    opacity: 0;
    transform: translateY(-6px);
  }
  15% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(18px);
  }
}

.plate {
  position: absolute;
  bottom: 9%;
  width: 40%;
  text-align: center;
  font-size: clamp(16px, 2.1vw, 24px);
  line-height: 1.1;
  color: rgba(236, 228, 244, 0.85);
  letter-spacing: 0.03em;
  text-shadow: 0 0 10px rgba(0, 0, 0, 1);
  pointer-events: none;
  transition: opacity 0.6s;
}
.plate.left {
  left: 7.5%;
}
.plate.right {
  right: 7.5%;
}
.plate:empty {
  opacity: 0;
}

/* ── Words over the arena ───────────────────────────────────────────────── */

.caption {
  position: absolute;
  left: 50%;
  top: 30%;
  transform: translateX(-50%);
  width: min(70%, 720px);
  padding: 14px 20px;
  font-size: clamp(17px, 2vw, 23px);
  line-height: 1.3;
  text-align: center;
  color: #efe6ff;
  background: radial-gradient(ellipse at center, rgba(5, 3, 10, 0.78) 0%, rgba(5, 3, 10, 0.5) 60%, transparent 100%);
  text-shadow: 0 0 12px rgba(0, 0, 0, 1);
  text-wrap: balance;
  opacity: 0;
  transition: opacity 0.9s;
  pointer-events: none;
}
.caption.show {
  opacity: 1;
}
.caption.pending {
  color: var(--faint);
}

.banner {
  position: absolute;
  left: 50%;
  top: 17%;
  transform: translate(-50%, -6px);
  font-family: var(--title);
  font-size: clamp(26px, 3.4vw, 40px);
  line-height: 1.1;
  letter-spacing: 0.02em;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.35s,
    transform 0.35s;
  max-width: 82%;
  text-align: center;
  text-shadow: 0 0 14px rgba(0, 0, 0, 1);
}
.banner.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.banner.good {
  color: var(--good);
  text-shadow: 0 0 18px rgba(120, 255, 100, 0.55), 0 0 4px #000;
}
.banner.bad {
  color: var(--bad);
  text-shadow: 0 0 18px rgba(255, 80, 80, 0.55), 0 0 4px #000;
}
.banner.info {
  color: var(--gold);
  font-family: var(--mono);
  font-size: 22px;
}

/* WHY a move worked – coloured keywords under the narration */
.why-line {
  position: absolute;
  left: 50%;
  top: calc(30% + 5.2em);
  transform: translateX(-50%);
  width: min(80%, 760px);
  font-family: var(--mono);
  font-size: clamp(16px, 1.6vw, 20px);
  line-height: 1.25;
  text-align: center;
  color: var(--muted);
  text-shadow: 0 0 8px #000, 0 0 3px #000;
  text-wrap: balance;
  opacity: 0;
  transition: opacity 0.6s;
  pointer-events: none;
}
.why-line.show {
  opacity: 1;
}
.w-verb {
  color: var(--gold);
}
.w-tag {
  color: var(--ember);
}
.w-badge {
  display: inline-block;
  padding: 0 6px;
  border: 1px solid currentColor;
  border-radius: 3px;
  color: var(--good);
  font-size: 0.85em;
}
.w-fail {
  color: var(--bad);
}

/* everything in the HUD explains itself on tap */
.hud,
.round,
.fields span {
  cursor: pointer;
  pointer-events: auto;
}
.round .floor {
  display: block;
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.08em;
  color: var(--ember);
  opacity: 0.85;
}
.round.grew {
  animation: grew 2.4s ease-out;
}
@keyframes grew {
  0%,
  30% {
    color: var(--ember);
    transform: scale(1.5);
    text-shadow: 0 0 16px var(--ember);
  }
  100% {
    transform: scale(1);
  }
}

.reveal-name {
  position: absolute;
  left: 50%;
  top: 30%;
  transform: translate(-50%, -50%);
  width: 90%;
  text-align: center;
  font-family: var(--title);
  font-size: clamp(34px, 6vw, 72px);
  line-height: 1;
  color: #fff4d8;
  text-shadow:
    0 0 12px rgba(255, 200, 120, 0.9),
    0 0 40px rgba(232, 100, 28, 0.6),
    3px 3px 0 #2a0a04;
  opacity: 0;
  transition: opacity 0.6s;
  pointer-events: none;
  text-wrap: balance;
}
.reveal-name.show {
  opacity: 1;
}
.reveal-name.discovery {
  color: #fff8e0;
  text-shadow:
    0 0 10px rgba(255, 230, 150, 1),
    0 0 36px rgba(240, 200, 80, 0.8),
    0 0 80px rgba(200, 160, 255, 0.5);
}
.reveal-sub {
  position: absolute;
  left: 50%;
  top: calc(30% + clamp(28px, 4.6vw, 54px));
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  font-size: clamp(16px, 1.8vw, 22px);
  letter-spacing: 0.08em;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(240, 200, 80, 0.7);
  opacity: 0;
  transition: opacity 0.6s;
  pointer-events: none;
}
.reveal-sub.show {
  opacity: 1;
}
.reveal-sub.quiet {
  color: var(--rune);
  text-shadow: 0 0 10px rgba(200, 160, 255, 0.6);
}

/* ── The line you speak on ──────────────────────────────────────────────── */

.command {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}
.line {
  position: relative;
  --glow: var(--rune);
}
.line.p0 {
  --glow: var(--p0);
}
.line.p1 {
  --glow: var(--p1);
}
.line::after {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--glow), transparent);
  opacity: 0.45;
  box-shadow: 0 0 10px var(--glow);
  transition:
    opacity 0.4s,
    left 0.6s,
    right 0.6s;
}
.line:focus-within::after {
  opacity: 1;
  left: 0;
  right: 0;
}
.busy .line::after {
  --glow: var(--rune);
  animation: breathe 1.3s ease-in-out infinite;
}
@keyframes breathe {
  50% {
    opacity: 0.25;
  }
}
.summon-input {
  width: 100%;
  min-width: 0;
  font: inherit;
  font-size: 30px;
  padding: 10px 44px;
  text-align: center;
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
  caret-color: var(--glow);
  text-overflow: ellipsis;
  text-shadow: 0 0 12px rgba(200, 160, 255, 0.25);
}
.summon-input::placeholder {
  color: var(--faint);
  opacity: 1;
}
.summon-input:disabled {
  color: var(--muted);
}
.enter-hint {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--glow);
  opacity: 0;
  font-size: 22px;
  transition: opacity 0.3s;
  pointer-events: none;
}
.enter-hint.show {
  opacity: 0.55;
}

/* ── Sigil menu ─────────────────────────────────────────────────────────── */

.menu-layer {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: radial-gradient(ellipse at center, rgba(10, 5, 20, 0.86) 0%, rgba(2, 1, 5, 0.95) 70%);
  z-index: 9;
  padding: 16px;
}
.menu-layer.open {
  display: grid;
  animation: fade-in 0.35s ease-out;
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
}
.menu {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.menu-item {
  font-family: var(--title);
  font-size: 32px;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 2px 16px;
  letter-spacing: 0.02em;
  transition:
    color 0.25s,
    text-shadow 0.25s;
}
.menu-item:hover,
.menu-item:focus-visible {
  color: #fff4d8;
  text-shadow: 0 0 14px rgba(240, 200, 80, 0.6);
  outline: none;
}
.menu-item.danger {
  margin-top: 14px;
  font-family: var(--mono);
  font-size: 20px;
  color: var(--faint);
}
.menu-item.danger:hover,
.menu-item.danger.armed {
  color: var(--bad);
  text-shadow: 0 0 12px rgba(255, 80, 80, 0.5);
}

/* ── Modals ─────────────────────────────────────────────────────────────── */

.modal-layer {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(2, 1, 5, 0.82);
  z-index: 10;
  padding: 16px;
}
.modal-layer.open {
  display: grid;
  animation: fade-in 0.3s ease-out;
}
.modal {
  width: min(680px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 16px 22px 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.6),
    0 0 80px rgba(110, 60, 180, 0.18);
}
.modal header {
  display: flex;
  align-items: center;
}
.modal h2 {
  font-family: var(--title);
  font-weight: 400;
  font-size: 38px;
  margin: 0 0 4px;
  color: var(--gold);
  text-shadow: 0 0 16px rgba(240, 200, 80, 0.35);
  flex: 1;
  text-wrap: balance;
}
.modal h3 {
  font-family: var(--title);
  font-weight: 400;
  font-size: 26px;
  margin: 6px 0 4px;
  color: var(--rune);
}
.modal-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--muted);
}
.modal label.check {
  flex-direction: row;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.modal .names {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.modal .actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 4px;
}
.modal .actions.small .hint {
  flex: 1;
  font-size: 16px;
}
.btn {
  font: inherit;
  font-size: 20px;
  padding: 6px 16px;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line-hi);
  cursor: pointer;
  transition:
    border-color 0.2s,
    color 0.2s,
    box-shadow 0.2s;
}
.btn:hover:not(:disabled) {
  border-color: var(--rune);
  color: #fff;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.primary {
  font-size: 24px;
  padding: 6px 22px;
  border-color: rgba(240, 200, 80, 0.6);
  color: #ffe9b8;
  box-shadow: 0 0 18px rgba(240, 200, 80, 0.12);
}
.btn.primary:hover:not(:disabled) {
  border-color: var(--gold);
  box-shadow: 0 0 24px rgba(240, 200, 80, 0.3);
}
.btn.ghost {
  border-color: transparent;
  color: var(--muted);
  font-size: 18px;
  padding: 4px 8px;
}
.btn.ghost:hover:not(:disabled) {
  color: var(--text);
  border-color: transparent;
}
.form-input {
  width: 100%;
  font: inherit;
  font-size: 22px;
  padding: 6px 2px;
  color: var(--text);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line-hi);
  outline: none;
}
.form-input:focus {
  border-bottom-color: var(--gold);
}
.remember p {
  margin: 4px 0 0;
}
.lore {
  font-size: 24px;
  line-height: 1.3;
  color: #dccdf2;
  margin: 4px 0;
}
.lore.pending {
  color: var(--faint);
  animation: breathe 1.6s ease-in-out infinite;
}
.hint {
  color: var(--muted);
  margin: 0;
}
.warn {
  color: var(--bad);
  margin: 0;
}
.status {
  margin: 0;
}
.score {
  margin: 0;
  color: var(--gold);
  font-size: 22px;
}
.chain {
  margin: 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.35;
}
.found ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.found li {
  color: var(--gold);
}
.found .by {
  color: var(--muted);
}
.rules {
  padding-left: 22px;
  margin: 0;
}
.rules li {
  margin-bottom: 6px;
}

/* ── Chronicle ──────────────────────────────────────────────────────────── */

.chronicle {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.chronicle li {
  padding-left: 10px;
  border-left: 1px solid var(--line);
  color: var(--text);
}
.chronicle li.p0 {
  border-color: var(--p0);
}
.chronicle li.p1 {
  border-color: var(--p1);
}
.chronicle li.failed {
  color: var(--muted);
  border-left-style: dashed;
}
.chronicle li.discovery .who {
  color: var(--gold);
}
.chronicle .who {
  display: block;
  font-size: 16px;
  color: var(--faint);
}
.chronicle .why {
  margin-top: 4px;
  font-size: 16px;
  color: var(--faint);
}
.chronicle .why summary {
  cursor: pointer;
  list-style: none;
}
.chronicle .why summary::-webkit-details-marker {
  display: none;
}
.chronicle .why ol {
  margin: 4px 0 0;
  padding-left: 20px;
  color: var(--muted);
}

/* ── Grimoire ───────────────────────────────────────────────────────────── */

.tabs {
  display: flex;
  gap: 16px;
}
.tab {
  font: inherit;
  font-size: 20px;
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  color: var(--faint);
  cursor: pointer;
  padding: 2px 0;
}
.tab.on {
  color: var(--text);
  border-bottom-color: var(--gold);
}
.grimoire {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 56vh;
  overflow: auto;
}
.grimoire .entry {
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: 12px;
  padding: 4px 6px;
  border-bottom: 1px solid rgba(200, 160, 255, 0.06);
}
.grimoire .entry.learned .ename {
  color: var(--gold);
  text-shadow: 0 0 8px rgba(240, 200, 80, 0.35);
}
.grimoire .escale {
  color: var(--faint);
}
.grimoire .emeta,
.grimoire .eflavor,
.grimoire .everbs {
  grid-column: 1 / -1;
  font-size: 16px;
  color: var(--muted);
}
.grimoire .eflavor {
  font-style: italic;
  color: #b8a8d8;
}
.grimoire .rulings {
  padding: 4px 6px 8px;
  font-size: 17px;
  color: var(--muted);
}
.grimoire .rulings summary {
  cursor: pointer;
  color: var(--rune);
}
.grimoire .rulings ul {
  margin: 4px 0 0;
  padding-left: 18px;
}
.learned-tags {
  padding: 4px 6px 8px;
  color: var(--rune);
  font-size: 17px;
}
.learned-tags .label {
  color: var(--faint);
}

/* Portrait phones: a taller arena – the centre of the scene is cropped in, the fighters stay visible. */
@media (max-width: 700px) and (orientation: portrait) {
  canvas.arena {
    aspect-ratio: auto;
    height: min(40dvh, 110vw);
    object-fit: cover;
  }
  .plate.left {
    left: 6%;
  }
  .plate.right {
    right: 6%;
  }
}

@media (max-width: 700px) {
  html,
  body {
    font-size: 18px;
  }
  #app {
    min-height: 100dvh;
    justify-content: flex-start;
    gap: 6px;
    padding-inline: max(8px, env(safe-area-inset-left, 0px));
    padding-block: max(6px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
  }
  /* the arena spans the full width – no fading edges eating the HUD */
  #app > .stage {
    margin-inline: -8px;
  }
  canvas.arena {
    -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
  }
  .modal {
    background: #0a0712;
  }
  .hud {
    top: 2%;
    width: 38%;
  }
  .hud.left {
    left: 3%;
  }
  .hud.right {
    right: 3%;
  }
  .hud .name {
    font-size: 16px;
  }
  .hud .stats {
    font-size: 14px;
  }
  .hud .delta {
    font-size: 18px;
  }
  .crown {
    top: 1%;
  }
  .sigil {
    width: 40px;
    height: 40px;
    padding: 6px;
  }
  .round {
    font-size: 16px;
  }
  .fields {
    font-size: 13px;
  }
  .plate {
    bottom: 4%;
    font-size: 14px;
    width: 46%;
  }
  .plate.left {
    left: 2%;
  }
  .plate.right {
    right: 2%;
  }
  .reveal-name {
    font-size: clamp(26px, 9vw, 44px);
    top: 34%;
  }
  .reveal-sub {
    top: calc(34% + 26px);
    font-size: 14px;
  }
  /* banner + narration below the arena, stacked, space reserved so nothing jumps or overlaps */
  .tale {
    position: static;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 5.2em;
    padding-inline: 4px;
  }
  .banner,
  .caption,
  .why-line {
    position: static;
    transform: none;
    width: 100%;
    max-width: none;
  }
  .banner {
    font-size: 24px;
  }
  .banner.show {
    transform: none;
  }
  .caption {
    padding: 2px 6px;
    font-size: 17px;
    background: none;
  }
  .why-line {
    font-size: 15px;
  }
  .summon-input {
    font-size: 20px;
    padding-inline: 34px;
  }
  .enter-hint {
    font-size: 20px;
  }
  /* menus and dialogs become full screen sheets */
  .menu-layer,
  .modal-layer {
    padding: 0;
  }
  .menu-item {
    font-size: 30px;
    padding-block: 6px;
    min-height: 48px;
  }
  .modal {
    width: 100%;
    height: 100dvh;
    max-height: 100dvh;
    padding: max(12px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
    border: none;
  }
  .modal h2 {
    font-size: 32px;
  }
  .modal .names {
    grid-template-columns: 1fr;
  }
  .btn {
    min-height: 44px;
  }
  .grimoire {
    max-height: none;
  }
}

button,
input,
.tab {
  touch-action: manipulation;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}
