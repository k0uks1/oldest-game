<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Oldest Game</title>
    <meta name="description" content="Ein Duell der Vorstellungskraft für zwei Spieler." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=VT323&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2315111f'/%3E%3Crect x='7' y='2' width='2' height='3' fill='%23ffc64a'/%3E%3Crect x='6' y='5' width='4' height='3' fill='%23e8641c'/%3E%3Crect x='5' y='8' width='6' height='6' fill='%23a3300f'/%3E%3C/svg%3E" />
    <style>
      :root {
  color-scheme: dark;
  --bg: #0b0911;
  --panel: #17121f;
  --panel-2: #211a2e;
  --line: #342d48;
  --line-hi: #54497a;
  --text: #ece4f4;
  --muted: #968cab;
  --faint: #5f5775;
  --gold: #f0c850;
  --ember: #e8641c;
  --rune: #c8a0ff;
  --good: #7dff6a;
  --bad: #ff6a6a;
  --p0: #7fc6e8;
  --p1: #ff8a6a;
  --shadow: #040209;
  --title: "Jacquard 24", "UnifrakturMaguntia", serif;
  --mono: "VT323", ui-monospace, "Cascadia Mono", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 20px;
  line-height: 1.2;
}

body {
  background:
    radial-gradient(ellipse at 50% -10%, #241a38 0%, transparent 55%),
    var(--bg);
  min-height: 100vh;
}

#app {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 10px 48px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ── Top bar: quiet ─────────────────────────────────────────────────────── */

.topbar {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
.topbar h1 {
  font-family: var(--title);
  font-weight: 400;
  font-size: 34px;
  margin: 0;
  color: var(--gold);
  text-shadow:
    2px 2px 0 #4a1208,
    0 0 16px rgba(232, 100, 28, 0.35);
}
.topbar .round {
  color: var(--faint);
  font-size: 19px;
  font-variant-numeric: tabular-nums;
}
.topbar nav {
  margin-left: auto;
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
}

/* ── Stage: the centre of attention ─────────────────────────────────────── */

.stage {
  position: relative;
  border: 3px solid var(--line);
  box-shadow:
    0 0 0 1px var(--shadow),
    0 18px 60px rgba(0, 0, 0, 0.6);
  background: #000;
  line-height: 0;
}
canvas.arena {
  width: 100%;
  max-width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  image-rendering: auto;
  display: block;
}

.hud {
  position: absolute;
  top: 10px;
  width: min(30%, 260px);
  line-height: 1.1;
  opacity: 0.6;
  transition: opacity 0.25s;
}
.hud.left {
  left: 12px;
}
.hud.right {
  right: 12px;
  text-align: right;
}
.hud.active {
  opacity: 1;
}
.hud .name {
  font-size: 24px;
  text-shadow: 2px 2px 0 var(--shadow);
}
.hud.left .name {
  color: var(--p0);
}
.hud.right .name {
  color: var(--p1);
}
.hud.active .name::after {
  content: " ◆";
  color: var(--gold);
  font-size: 16px;
}
.hud.right.active .name::after {
  content: "";
}
.hud.right.active .name::before {
  content: "◆ ";
  color: var(--gold);
  font-size: 16px;
}
.hud .bar {
  height: 8px;
  margin-top: 5px;
  background: rgba(10, 7, 16, 0.85);
  border: 2px solid #2a2340;
}
.hud .fill {
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--ember) 0 6px, #b8401a 6px 8px);
  box-shadow: 0 0 8px rgba(232, 100, 28, 0.6);
  transition: width 0.5s steps(10);
}
.hud.right .bar {
  transform: scaleX(-1);
}
.hud .stats {
  margin-top: 3px;
  font-size: 17px;
  color: var(--muted);
  text-shadow: 1px 1px 0 var(--shadow);
  font-variant-numeric: tabular-nums;
}

.plate {
  position: absolute;
  bottom: 8%;
  width: 40%;
  text-align: center;
  font-size: clamp(16px, 2.2vw, 24px);
  line-height: 1.1;
  color: var(--text);
  text-shadow:
    2px 2px 0 var(--shadow),
    0 0 10px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  transition: opacity 0.4s;
}
.plate.left {
  left: 7.5%;
}
.plate.right {
  right: 7.5%;
}
.plate:empty {
  opacity: 0;
}

.caption {
  position: absolute;
  left: 50%;
  top: 34%;
  transform: translateX(-50%);
  width: min(78%, 760px);
  padding: 10px 16px;
  font-size: clamp(17px, 2vw, 23px);
  line-height: 1.25;
  text-align: center;
  color: #f4ecff;
  background: rgba(8, 6, 14, 0.72);
  border-top: 1px solid rgba(200, 160, 255, 0.25);
  border-bottom: 1px solid rgba(200, 160, 255, 0.25);
  text-wrap: balance;
  opacity: 0;
  transition: opacity 0.6s;
  pointer-events: none;
}
.caption.show {
  opacity: 1;
}
.caption.pending {
  color: var(--muted);
}

.banner {
  position: absolute;
  left: 50%;
  top: 16%;
  transform: translate(-50%, -8px);
  padding: 6px 16px;
  font-size: 24px;
  line-height: 1.1;
  background: rgba(8, 6, 14, 0.88);
  border: 2px solid var(--line-hi);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;
  max-width: 80%;
  text-align: center;
}
.banner.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.banner.good {
  color: var(--good);
  border-color: #2e6a1c;
}
.banner.bad {
  color: var(--bad);
  border-color: #6e1024;
}
.banner.info {
  color: var(--gold);
}

/* ── Command line: the only other thing that matters ────────────────────── */

.command {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
}
.prompt {
  font-size: 22px;
  color: var(--muted);
  text-align: center;
  text-wrap: balance;
}
.prompt .p0 {
  color: var(--p0);
}
.prompt .p1 {
  color: var(--p1);
}
.prompt .target {
  color: var(--gold);
}
.command-row {
  display: flex;
  gap: 8px;
}
.summon-input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 30px;
  padding: 10px 16px;
  color: var(--text);
  background: #0a0710;
  border: 3px solid var(--line);
  box-shadow: inset 0 0 0 1px var(--shadow);
  outline: none;
  transition:
    border-color 0.2s,
    box-shadow 0.2s;
}
.summon-input::placeholder {
  color: var(--faint);
}
.summon-input:focus {
  border-color: var(--gold);
  box-shadow:
    inset 0 0 0 1px var(--shadow),
    0 0 18px rgba(240, 200, 80, 0.25);
}
.summon-input:disabled {
  border-color: var(--rune);
  box-shadow: 0 0 22px rgba(200, 160, 255, 0.35);
  animation: breathe 1.2s ease-in-out infinite;
}
@keyframes breathe {
  50% {
    box-shadow: 0 0 34px rgba(200, 160, 255, 0.55);
  }
}
.subactions {
  display: flex;
  justify-content: center;
  gap: 18px;
  font-size: 18px;
}

.btn {
  font: inherit;
  font-size: 20px;
  padding: 6px 14px;
  color: var(--text);
  background: var(--panel-2);
  border: 3px solid var(--line);
  box-shadow:
    inset 2px 2px 0 var(--line-hi),
    inset -2px -2px 0 var(--shadow);
  cursor: pointer;
}
.btn:hover:not(:disabled) {
  border-color: var(--line-hi);
  color: #fff;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.primary {
  font-size: 26px;
  padding: 6px 20px;
  background: #4a1208;
  border-color: var(--ember);
  color: #ffe0b0;
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--muted);
  font-size: 18px;
  padding: 4px 8px;
}
.btn.ghost:hover:not(:disabled) {
  color: var(--text);
  border-color: transparent;
}
.btn.link {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0;
  color: var(--faint);
  font-size: 18px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn.link:hover {
  color: var(--bad);
}

/* ── Chronicle: available, not in the way ───────────────────────────────── */

.chronicle-wrap {
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  color: var(--muted);
}
.chronicle-wrap summary {
  cursor: pointer;
  text-align: center;
  font-size: 18px;
  color: var(--faint);
  list-style: none;
}
.chronicle-wrap summary::-webkit-details-marker {
  display: none;
}
.chronicle-wrap[open] summary {
  margin-bottom: 8px;
}
.chronicle {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chronicle li {
  padding-left: 10px;
  border-left: 3px solid var(--line);
  color: var(--text);
}
.chronicle li.p0 {
  border-color: var(--p0);
}
.chronicle li.p1 {
  border-color: var(--p1);
}
.chronicle li.failed {
  color: var(--muted);
  border-left-style: dashed;
}
.chronicle .who {
  display: block;
  font-size: 16px;
  color: var(--faint);
}

/* ── Debug details (only with ?debug) ───────────────────────────────────── */

.details {
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas:
    "sprite info"
    "verbs verbs";
  gap: 10px 14px;
  padding: 10px;
  background: #120e1c;
  border: 2px dashed var(--line);
}
.details::before {
  content: "DEBUG";
  grid-column: 1 / -1;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--faint);
}
.details > .hint,
.details > .warn {
  grid-column: 1 / -1;
  margin: 0;
}
.sprite-box {
  grid-area: sprite;
  display: grid;
  place-items: end center;
  width: 136px;
  min-height: 90px;
}
canvas.sprite {
  image-rendering: pixelated;
  max-width: 132px;
}
.info {
  grid-area: info;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.info .title {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.info .name {
  font-size: 26px;
  color: var(--gold);
}
.badge {
  font-size: 15px;
  padding: 0 6px;
  border: 2px solid var(--line);
  color: var(--muted);
  text-transform: uppercase;
}
.note,
.meta,
.flavor {
  font-size: 18px;
  color: var(--muted);
}
.flavor {
  font-style: italic;
}
.meta strong {
  color: var(--text);
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tag {
  font-size: 16px;
  padding: 0 5px;
  background: #1c1728;
  border: 1px solid #2c2640;
  color: var(--muted);
}
.tag.own {
  color: var(--text);
  border-color: var(--line-hi);
}
.tag.weak {
  color: var(--bad);
  border-color: #6e1024;
}
.verbs {
  grid-area: verbs;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 6px;
}
.verb {
  font: inherit;
  text-align: left;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 8px;
  padding: 6px 8px;
  color: var(--text);
  background: #1a1526;
  border: 2px solid var(--line);
  cursor: pointer;
}
.verb .vlabel {
  font-size: 20px;
}
.verb .vlev {
  font-size: 16px;
  color: var(--muted);
}
.verb .vwhy {
  grid-column: 1 / -1;
  font-size: 16px;
  color: var(--muted);
}
.verb.ok .vwhy {
  color: #9ad880;
}
.verb.no {
  opacity: 0.6;
  cursor: not-allowed;
}
.verb.no .vwhy {
  color: #d08080;
}
.verb.selected {
  border-color: var(--gold);
  background: #2a2010;
}
.hint {
  color: var(--muted);
  font-size: 18px;
}
.warn {
  color: var(--bad);
  font-size: 18px;
}
.status {
  color: var(--gold);
}

/* ── Modals ─────────────────────────────────────────────────────────────── */

.modal-layer {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(4, 2, 9, 0.78);
  z-index: 10;
  padding: 16px;
}
.modal-layer.open {
  display: grid;
}
.modal {
  width: min(680px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 14px 18px 18px;
  background: var(--panel);
  border: 3px solid var(--line);
  box-shadow:
    inset 2px 2px 0 var(--line-hi),
    inset -2px -2px 0 var(--shadow),
    6px 6px 0 var(--shadow);
}
.modal header {
  display: flex;
  align-items: center;
}
.modal h2 {
  font-family: var(--title);
  font-weight: 400;
  font-size: 36px;
  margin: 0;
  color: var(--gold);
  flex: 1;
  text-wrap: balance;
}
.modal-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--muted);
}
.modal label.check {
  flex-direction: row;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.modal .names {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.modal .actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.form-input {
  width: 100%;
  font: inherit;
  font-size: 22px;
  padding: 7px 10px;
  color: var(--text);
  background: #0a0710;
  border: 3px solid var(--line);
  outline: none;
}
.form-input:focus {
  border-color: var(--gold);
}
.remember p {
  margin: 4px 0 0;
}
.lore {
  font-size: 24px;
  color: #d8c8f0;
}
.rules li {
  margin-bottom: 6px;
}
.compendium {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 60vh;
  overflow: auto;
}
.compendium .entry {
  display: grid;
  grid-template-columns: 1fr auto;
  padding: 4px 8px;
  background: #16121f;
  cursor: pointer;
}
.compendium .entry:hover {
  background: var(--panel-2);
}
.compendium .escale {
  color: var(--muted);
}
.compendium .everbs {
  grid-column: 1 / -1;
  font-size: 16px;
  color: var(--muted);
}

@media (max-width: 700px) {
  .topbar h1 {
    font-size: 28px;
  }
  .hud {
    width: 42%;
  }
  .hud .name {
    font-size: 18px;
  }
  .hud .stats {
    font-size: 15px;
  }
  .caption {
    top: auto;
    bottom: 22%;
    width: 92%;
  }
  .summon-input {
    font-size: 22px;
  }
  .btn.primary {
    font-size: 20px;
    padding: 6px 12px;
  }
  .details {
    grid-template-columns: 1fr;
    grid-template-areas:
      "sprite"
      "info"
      "verbs";
  }
  .modal .names {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}
